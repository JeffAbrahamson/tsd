[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsd"
version = "0.1.0"
description = "Command-line tool for maintaining simple daily time series data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["matplotlib", "numpy", "python-dateutil", "seaborn"]

[project.optional-dependencies]
dev = ["black==24.4.2", "pyflakes", "pytest"]
# Matplotlib prefers Qt when it is importable; unlike Tk, Qt draws natively
# on Wayland, so plot windows open without Xwayland.
gui = ["PyQt6"]

[project.scripts]
tsd = "tsd.cli:main"
tsd-today = "tsd.today:main"
tsd-plot = "tsd_plot:main"
tsd-season-plot = "tsd_plot.seasonal:main"
tsd-time-to-empty = "tsd.time_to_empty:main"
tsd-mc-time-to-empty = "tsd.mc_time_to_empty:main"

[tool.black]
required-version = "24.4.2"
target-version = ["py312"]
extend-exclude = '''
/\.venv/
'''

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
